<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>VRエフェクト コントローラー</title>
  <style>
    :root { 
      --bg-color: #121212;
      --accent: rgba(255, 255, 255, 0.8);
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
    }
    body { 
      /* 少し没入感のあるダーク系のグラデーション背景 */
      background: linear-gradient(135deg, #1e1e1e 0%, #0a0a0a 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
      margin: 0; padding: 20px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; box-sizing: border-box;
      user-select: none; -webkit-user-select: none;
      overflow: hidden;
    }
    .status-text {
      position: absolute; top: 40px;
      font-size: 14px; letter-spacing: 2px;
      color: rgba(255,255,255,0.5);
      transition: color 0.3s;
    }
    .status-text.ready { color: #4ade80; } /* 準備OK時は薄い緑 */

    /* グラスモーフィズムな巨大ボタン */
    .btn-action-wrapper {
      position: relative;
      width: 80vw; height: 80vw;
      max-width: 350px; max-height: 350px;
      border-radius: 50%;
      /* グラスモーフィズムのキモ */
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
      touch-action: none; /* スクロール防止 */
    }
    .btn-action-text {
      font-size: 40px; font-weight: bold; letter-spacing: 4px;
      color: rgba(255,255,255,0.3);
      transition: color 0.3s;
    }

    /* システムから「許可」が出た状態 */
    .btn-action-wrapper.enabled {
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
    }
    .btn-action-wrapper.enabled .btn-action-text {
      color: var(--accent);
    }

    /* 指で押し込んでいる状態 */
    .btn-action-wrapper.enabled:active, .btn-action-wrapper.active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 60px rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    /* 未接続・待機状態のカバー */
    #overlay {
      position: absolute; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.8); z-index: 10;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
    }
    #connectBtn {
      padding: 16px 32px; font-size: 18px; border-radius: 30px;
      background: #fff; color: #000; border: none; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <p style="margin-bottom: 20px; letter-spacing: 1px;">システムの準備が完了しました</p>
    <button id="connectBtn">ライブに参加する</button>
  </div>

  <div class="status-text" id="statusText">STANDBY...</div>

  <div class="btn-action-wrapper" id="actionWrapper">
    <div class="btn-action-text">TAP</div>
  </div>

  <script>
    const WS_URL = 'wss://representative-maure-color2026-1a89845b.koyeb.app'; 
    const OSC_BASE_PATH = '/ELVR/turn';

    // URLパラメータ（?seat=〇〇）から座席番号を取得
    const params = new URLSearchParams(window.location.search);
    const seatNum = params.get('seat') || 'guest';
    const dynamicAddress = OSC_BASE_PATH + seatNum;

    let ws = null;
    let isConnected = false;
    let isSystemEnabled = false; // ホストからの許可フラグ

    const overlay = document.getElementById('overlay');
    const connectBtn = document.getElementById('connectBtn');
    const actionWrapper = document.getElementById('actionWrapper');
    const statusText = document.getElementById('statusText');

    function connectWS() {
      try { ws?.close(); } catch {}
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        isConnected = true;
        overlay.style.display = 'none';
        ws.send('/Connect 1');
      };

      // ホストからの指令を受信する
      ws.onmessage = (event) => {
        const msg = event.data.toString();
        if (msg === '/System/Enable 1') {
          isSystemEnabled = true;
          actionWrapper.classList.add('enabled');
          statusText.textContent = 'READY TO PLAY';
          statusText.classList.add('ready');
          if(navigator.vibrate) navigator.vibrate(100); // 解放時に短く震える
        } else if (msg === '/System/Enable 0') {
          isSystemEnabled = false;
          actionWrapper.classList.remove('enabled');
          statusText.textContent = 'STANDBY...';
          statusText.classList.remove('ready');
        }
      };

      ws.onerror = () => alert("接続エラーが発生しました。再読み込みしてください。");
      ws.onclose = () => {
        isConnected = false;
        overlay.style.display = 'flex';
        document.querySelector('#overlay p').textContent = "通信が切断されました";
        connectBtn.textContent = "再接続";
      };
    }

    connectBtn.addEventListener('click', connectWS);

    // 押した時 (1を送信)
    actionWrapper.addEventListener('pointerdown', (e) => {
      if (!isConnected || !isSystemEnabled) return;
      actionWrapper.classList.add('active');
      if (ws.readyState === WebSocket.OPEN) ws.send(dynamicAddress + ' 1');
      if (navigator.vibrate) navigator.vibrate(40);
    });

    // 離した時 (0を送信)
    const releaseAction = () => {
      if (!isConnected || !isSystemEnabled) return;
      actionWrapper.classList.remove('active');
      if (ws.readyState === WebSocket.OPEN) ws.send(dynamicAddress + ' 0');
    };

    actionWrapper.addEventListener('pointerup', releaseAction);
    actionWrapper.addEventListener('pointercancel', releaseAction); // 画面外に指がずれた時用
  </script>
</body>
</html>
